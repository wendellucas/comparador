<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comparador de arquivos por hash criptográfico (SHA-256, MD5, SHA-1, SHA-512).">

  <!-- iOS / PWA meta tags e ícones -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Comparador Hash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Comparador de Arquivos por Hash</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Splash HTML nativo exibido enquanto o motor Flutter Web inicializa */
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #0F172A;
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    #app-splash img {
      width: 96px;
      height: 96px;
    }

    #app-splash .splash-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #F8FAFC;
    }

    #app-splash .splash-version {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: #1E293B;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-label="Carregando Comparador Hash">
    <img src="icons/Icon-192.png" alt="Logo Comparador Hash">
    <div class="splash-title">Comparador de Arquivos por Hash</div>
    <div class="splash-version">v0.2</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
